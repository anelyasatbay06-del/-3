<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зертханалық жұмыс №3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Зертханалық жұмыс №3</h1>
        
        <div class="nav-buttons">
            <button onclick="showTask(1)" class="tab-btn active">1-тапсырма</button>
            <button onclick="showTask(2)" class="tab-btn">2-тапсырма</button>
            <button onclick="showTask(3)" class="tab-btn">3-тапсырма</button>
            <button onclick="showTask(4)" class="tab-btn">4-тапсырма</button>
            <button onclick="showTask(5)" class="tab-btn">5-тапсырма</button>
            <button onclick="showTask(6)" class="tab-btn">6-тапсырма</button>
            <button onclick="showTask(7)" class="tab-btn">7-тапсырма</button>
            <button onclick="showTask(8)" class="tab-btn">8-тапсырма</button>
            <button onclick="showTask(9)" class="tab-btn">9-тапсырма</button>
            <button onclick="showTask(10)" class="tab-btn">10-тапсырма</button>
        </div>

        <div id="task1" class="task-card active">
            <h2>1. Студент туралы ақпарат</h2>
            <input type="text" id="t1_name" placeholder="Аты-жөніңіз">
            <input type="number" id="t1_age" placeholder="Жасыңыз">
            <input type="text" id="t1_spec" placeholder="Мамандығыңыз">
            <button onclick="runTask1()">Тексеру</button>
            <div class="result" id="res1"></div>
        </div>

        <div id="task2" class="task-card">
            <h2>2. Екі санмен жұмыс</h2>
            <input type="number" id="t2_num1" placeholder="Бірінші сан">
            <input type="number" id="t2_num2" placeholder="Екінші сан">
            <button onclick="runTask2()">Есептеу</button>
            <div class="result" id="res2"></div>
        </div>

        <div id="task3" class="task-card">
            <h2>3. Сан анализаторы</h2>
            <input type="number" id="t3_num" placeholder="Бүтін сан енгізіңіз">
            <button onclick="runTask3()">Талдау</button>
            <div class="result" id="res3"></div>
        </div>

        <div id="task4" class="task-card">
            <h2>4. Студенттің қорытынды бағасы</h2>
            <input type="number" id="t4_m1" placeholder="1-пән бағасы">
            <input type="number" id="t4_m2" placeholder="2-пән бағасы">
            <input type="number" id="t4_m3" placeholder="3-пән бағасы">
            <input type="number" id="t4_att" placeholder="Сабаққа қатысу (%)">
            <button onclick="runTask4()">Есептеу</button>
            <div class="result" id="res4"></div>
        </div>

        <div id="task5" class="task-card">
            <h2>5. Интернет-дүкен</h2>
            <input type="number" id="t5_price" placeholder="Тауар бағасы (тг)">
            <input type="number" id="t5_count" placeholder="Тауар саны">
            <button onclick="runTask5()">Есептеу</button>
            <div class="result" id="res5"></div>
        </div>

        <div id="task6" class="task-card">
            <h2>6. Уақытты анықтау</h2>
            <input type="number" id="t6_hour" placeholder="Сағат (0-23)">
            <button onclick="runTask6()">Анықтау</button>
            <div class="result" id="res6"></div>
        </div>

        <div id="task7" class="task-card">
            <h2>7. Үш санды талдау</h2>
            <input type="number" id="t7_n1" placeholder="1-ші сан">
            <input type="number" id="t7_n2" placeholder="2-ші сан">
            <input type="number" id="t7_n3" placeholder="3-ші сан">
            <button onclick="runTask7()">Талдау</button>
            <div class="result" id="res7"></div>
        </div>

        <div id="task8" class="task-card">
            <h2>8. Банк несие жүйесі</h2>
            <input type="number" id="t8_age" placeholder="Жасыңыз">
            <input type="number" id="t8_income" placeholder="Айлық табыс (тг)">
            <input type="number" id="t8_exp" placeholder="Жұмыс өтілі (жыл)">
            <button onclick="runTask8()">Несиені тексеру</button>
            <div class="result" id="res8"></div>
        </div>

        <div id="task9" class="task-card">
            <h2>9. Емтихан нәтижесi</h2>
            <input type="number" id="t9_exam" placeholder="Емтихан балы">
            <input type="number" id="t9_prac" placeholder="Практикалық жұмыс балы">
            <button onclick="runTask9()">Тексеру</button>
            <div class="result" id="res9"></div>
        </div>

        <div id="task10" class="task-card">
            <h2>10. «Студентті бағалау жүйесі»</h2>
            <input type="text" id="t10_name" placeholder="Аты-жөні">
            <input type="number" id="t10_age" placeholder="Жасы">
            <input type="number" id="t10_m1" placeholder="1-пән бағасы">
            <input type="number" id="t10_m2" placeholder="2-пән бағасы">
            <input type="number" id="t10_m3" placeholder="3-пән бағасы">
            <input type="number" id="t10_att" placeholder="Сабаққа қатысу (%)">
            <select id="t10_card">
                <option value="yes">Студенттік билеті БАР</option>
                <option value="no">Студенттік билеті ЖОҚ</option>
            </select>
            <button onclick="runTask10()">Жүйелік талдау</button>
            <div class="result" id="res10"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
